<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Synapse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="control-panel">
        <div id="timer">0.0秒</div>
        <button id="start-btn">START</button>
    </div>
    <div id="game-container">
        <!-- 3x3テーブルを4つ準備-->
         <div class="grid-3x3" id="table-1"></div>
         <div class="grid-3x3" id="table-2"></div>
         <div class="grid-3x3" id="table-3"></div>
         <div class="grid-3x3" id="table-4"></div>
         
         <!--tagNumber-->
         <div id="center-target">1</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
